name: Publish Universal Schema Package

on:
  push:
    branches:
      - main

jobs:
  publish-package:
    runs-on: ubuntu-latest
    environment: 
      name: omni
    steps:
      - name: GitHub Actions User
        run: |
          echo "GitHub Actor: $GITHUB_ACTOR"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install Yarn 3.6.4
        run: |
            corepack enable
            yarn set version 3.6.4
      - name: Configure Yarn
        run: |
          cat >.yarnrc.yml <<EOF
          nodeLinker: node-modules
          npmScopes:
            inside-labs:
              npmAuthToken: "${{ secrets.NPM_TOKEN }}"
              npmPublishRegistry: "https://npm.pkg.github.com"
              npmRegistryServer: "https://npm.pkg.github.com"
          EOF
      - name: Install dependencies
        run: yarn install
      - name: Validate OpenAPI schema
        run: yarn validate
      - name: Lint OpenAPI schema
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Test schema loading
        run: |
          node -e "
            const { schema, validateSchema } = require('./dist/index.js');
            console.log('✓ Schema loaded successfully');
            console.log('✓ Schema version:', schema.info.version);
            console.log('✓ Available paths:', Object.keys(schema.paths).length);
            validateSchema();
            console.log('✓ Schema validation passed');
          "
      - name: Bump patch version
        run: yarn version patch
      - name: Publish
        run: yarn npm publish
      - name: Commit version changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: bump version [skip ci]"
          git push origin main
