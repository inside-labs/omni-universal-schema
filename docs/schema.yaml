openapi: 3.1.0
info:
  title: Inside Labs Universal API Schema
  description: |
    Central OpenAPI schema for Inside Labs services.
    This schema defines common endpoints, models, and patterns used across all Inside Labs services.
  version: 1.0.0
  contact:
    name: Inside Labs API Team
    url: https://github.com/inside-labs/omni-universal-schema
    email: api@inside-labs.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.inside-labs.com/v1
    description: Production server
  - url: https://staging-api.inside-labs.com/v1
    description: Staging server
  - url: http://localhost:3000/v1
    description: Local development server

security:
  - bearerAuth: []

paths:

  /orders:
    get:
      summary: List orders
      description: Retrieve a paginated list of orders
      operationId: listOrders
      tags:
        - Orders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: userId
          in: query
          description: Filter orders by user ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    get:
      summary: Get order by ID
      description: Retrieve a specific order by its ID
      operationId: getOrderById
      tags:
        - Orders
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    OrderIdParam:
      name: orderId
      in: path
      description: Unique identifier for an order
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    OrderDetails:
      type: object
      required:
        - id
        - createdAt
        - totalPaid
        - totalPrice
        - currency
        - status
        - paymentStatus
        - products
      properties:
        id:
          type: string
          description: Unique identifier for the order
        createdAt:
          type: string
          format: date-time
          description: When the order was created
        totalPaid:
          type: number
          format: decimal
          minimum: 0
          description: Total amount paid for the order
        totalPrice:
          type: number
          format: decimal
          minimum: 0
          description: Total price of the order
        shippingPrice:
          type: number
          format: decimal
          minimum: 0
          description: Shipping cost
          nullable: true
        totalRefunded:
          type: number
          format: decimal
          minimum: 0
          description: Total amount refunded
          nullable: true
        currency:
          type: string
          description: Currency of the order
        status:
          type: string
          description: Current status of the order
        paymentStatus:
          type: string
          description: Payment status of the order
        products:
          type: array
          items:
            $ref: '#/components/schemas/ShopOrderProduct'
          description: List of products in the order
        billingAddress:
          $ref: '#/components/schemas/ShopAddress'
          nullable: true
        shippingAddress:
          $ref: '#/components/schemas/ShopAddress'
          nullable: true

    ShopOrderProduct:
      type: object
      required:
        - id
        - name
        - status
        - price
        - currency
        - serviceType
        - orderId
      properties:
        id:
          type: string
          description: Unique identifier for the product
        name:
          type: string
          description: Name of the product
        description:
          type: string
          description: Description of the product
          nullable: true
        status:
          type: string
          description: Status of the product
        price:
          type: number
          format: decimal
          minimum: 0
          description: Price of the product
        discount:
          type: number
          format: decimal
          minimum: 0
          description: Discount applied
          nullable: true
        currency:
          type: string
          description: Currency of the product price
        serviceType:
          type: string
          description: Type of service
        orderId:
          type: string
          description: Associated order ID
        transactionId:
          type: string
          description: Transaction ID
          nullable: true
        purchaseTime:
          type: string
          format: date-time
          description: When the product was purchased
          nullable: true
        validity:
          $ref: '#/components/schemas/ProductValidity'
          nullable: true
        claim:
          $ref: '#/components/schemas/ProductClaim'
          nullable: true
        productOrderDetails:
          type: array
          items:
            $ref: '#/components/schemas/ProductOrderDetail'
          description: Additional order details for the product

    ShopAddress:
      type: object
      properties:
        street:
          type: string
          description: Street address
          nullable: true
        city:
          type: string
          description: City
          nullable: true
        state:
          type: string
          description: State or province
          nullable: true
        postalCode:
          type: string
          description: Postal/ZIP code
          nullable: true
        country:
          type: string
          description: Country
          nullable: true

    ProductValidity:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          nullable: true
        datetimeRange:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
          nullable: true

    ProductClaim:
      type: object
      properties:
        ticketCodes:
          type: array
          items:
            $ref: '#/components/schemas/ClaimCode'
          nullable: true
        collectionCodes:
          type: array
          items:
            $ref: '#/components/schemas/ClaimCode'
          nullable: true
        claimDetails:
          type: array
          items:
            $ref: '#/components/schemas/ProductOrderDetail'
          nullable: true

    ClaimCode:
      type: object
      properties:
        type:
          type: string
        code:
          type: string
        format:
          type: string
        guest:
          $ref: '#/components/schemas/Guest'
          nullable: true
        codeInfo:
          $ref: '#/components/schemas/ClaimCodeInfo'
          nullable: true

    Guest:
      type: object
      properties:
        title:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        keycard:
          type: string
          nullable: true

    ClaimCodeInfo:
      type: object
      properties:
        title:
          type: string
          nullable: true
        text:
          type: string
          nullable: true

    ProductOrderDetail:
      oneOf:
        - $ref: '#/components/schemas/KeyProductOrderDetail'
        - $ref: '#/components/schemas/NameProductOrderDetail'
        - $ref: '#/components/schemas/TicketProductOrderDetail'
        - $ref: '#/components/schemas/NumberProductOrderDetail'
        - $ref: '#/components/schemas/DateRangeProductOrderDetail'
        - $ref: '#/components/schemas/DateProductOrderDetail'
        - $ref: '#/components/schemas/TextProductOrderDetail'
        - $ref: '#/components/schemas/TimeProductOrderDetail'
      discriminator:
        propertyName: _type

    KeyProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [KeyProductOrderDetail]
        keys:
          type: array
          items:
            type: string
        label:
          type: string
          nullable: true

    NameProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [NameProductOrderDetail]
        title:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        name:
          type: string
          nullable: true

    TicketProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [TicketProductOrderDetail]
        label:
          type: string
          nullable: true
        tickets:
          type: array
          items:
            type: string

    NumberProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [NumberProductOrderDetail]
        label:
          type: string
          nullable: true
        number:
          type: number

    DateRangeProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [DateRangeProductOrderDetail]
        label:
          type: string
          nullable: true
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    DateProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [DateProductOrderDetail]
        label:
          type: string
          nullable: true
        date:
          type: string
          format: date

    TextProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [TextProductOrderDetail]
        label:
          type: string
          nullable: true
        text:
          type: string

    TimeProductOrderDetail:
      type: object
      required:
        - _type
      properties:
        _type:
          type: string
          enum: [TimeProductOrderDetail]
        label:
          type: string
          nullable: true
        time:
          type: string
          format: time

    OrdersListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    OrderSummary:
      type: object
      required:
        - id
        - createdAt
        - status
        - currency
        - totalPaid
      properties:
        id:
          type: string
          description: Unique identifier for the order
        createdAt:
          type: string
          format: date-time
          description: When the order was created
        status:
          type: string
          description: Current status of the order
        currency:
          type: string
          description: Currency of the order
        totalPaid:
          type: number
          format: decimal
          minimum: 0
          description: Total amount paid for the order

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number
        limit:
          type: integer
          minimum: 1
          description: Number of items per page
        total:
          type: integer
          minimum: 0
          description: Total number of items
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages
        hasNext:
          type: boolean
          description: Whether there is a next page
        hasPrev:
          type: boolean
          description: Whether there is a previous page

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Error type or code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that caused the error
              message:
                type: string
                description: Specific error message for the field
          description: Detailed error information
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        requestId:
          type: string
          description: Unique identifier for the request

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Orders
    description: Order management operations
